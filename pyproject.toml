[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rechercheassistent-senatsdatenbank"
version = "0.1.1"
description = "Local PDF retrieval with source-linked Gemini answers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf==6.10.0", "pdfplumber==0.11.9"]

[project.scripts]
rechercheassistent-senatsdatenbank = "runtime:main"
agent-senatsdatenbank = "runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agent", "bridge", "document_search", "document_metadata", "migrate_state", "corpus_stats", "corpus_topics", "topic_charts", "gemini_bridge", "gemini_client", "search_terms", "runtime", "demo"]
